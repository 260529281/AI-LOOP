id: mood-whitelist
title: 设置页新增心情白名单
project: qq-avatar-app
requirement: |
  在手机端 App 的设置页加「心情白名单」：四种表情（平常 / 开心 / 思考 / 难过）默认全开；
  用户可以逐项勾选允许显示的心情；hub 推来一个未勾选的心情时，立绘回退显示「平常」；
  勾选状态需要持久化，App 重启后保留。范围仅限手机端，不改 qq-bridge。
acceptance:
  - 默认四套全开，没动过设置时行为和现在一致
  - 设置页能逐项开关心情，勾选后立即生效
  - 勾选状态持久化，进程重启后仍然生效
  - 收到未勾选的心情时立绘回退到「平常」
  - 改动只落在 app/src/main/java 下，且 assembleDebug 通过
risk_tier: medium
patch_paths: ["app/src/main/java/**"]

# 实现环的验收由本卡自带：允许路径、源码上下文、行为探针、逐条标准。
implement:
  patch_scope: ["app/src/main/java/**"]
  source_context:
    - app/src/main/java/com/example/qqavatar/AvatarViewModel.kt
    - app/src/main/java/com/example/qqavatar/MainActivity.kt
  probes:
    - id: default_all
      text: 默认全开：白名单初值来自表情全集
      any:
        - 'Emotion\.(?:entries|values\(\))[^\n]{0,60}to(?:Set|MutableSet)\(\)'
        - 'EnumSet\.allOf\(\s*Emotion'
        - 'Emotion\.(?:entries|values\(\))[^\n]{0,80}all'
    - id: persisted
      text: 勾选持久化：写进本地存储，启动时还能读回
      all:
        - '(?:getStringSet|getString|getBoolean)\('
        - '(?:putStringSet|putString|putBoolean)\('
        - '(?i)"[^"]*(?:mood|emotion|allow|white)[^"]*"'
    - id: fallback
      text: 未勾选回退平常：不在白名单时落到 NEUTRAL
      any:
        - '\bin\b[^\n]{0,120}else[^\n]{0,80}NEUTRAL'
        - '(?:contains\(|not\s+in\b|!in\b)[^\n]{0,160}NEUTRAL'
        - 'resolve\([^\n]{0,200}NEUTRAL'
    - id: toggle_ui
      text: 设置页逐项开关：每个表情一个控件，勾选即生效
      all:
        - '(?:Checkbox|Switch)\s*\('
        - 'onCheckedChange'
        - 'Emotion\.(?:entries|values\(\))'
  criteria:
    - id: C1
      text: 改动只落在 app/src/main/java 下
      check: {type: evidence_true, key: scope_ok}
    - id: C2
      text: 补丁能干净应用到项目副本
      check: {type: evidence_true, key: patch_applied}
    - id: C3
      text: 默认全开——用户没保存过设置时，四种心情全部允许
      check: {type: behavior, probe: default_all}
    - id: C4
      text: 勾选持久化——开关写入本地存储，重启后能读回同一份集合
      check: {type: behavior, probe: persisted}
    - id: C5
      text: 未勾选回退平常——收到被关掉的心情时立绘显示「平常」
      check: {type: behavior, probe: fallback}
    - id: C6
      text: 设置页能逐项开关心情，勾选后立即生效
      check: {type: behavior, probe: toggle_ui}
    - id: C7
      text: assembleDebug 通过
      check: {type: evidence_true, key: build_ok}
